<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title> Aula 05: Regiões do Brasil</title>
    </head>
    <body>
        <h2> Exenplos de destaques de textos</h2>
        <p><b>Esse é um texto em negrito</b></p>
        <p><i>Esse é um texto em itálico</i></p>
        <p><u>Esse é um texto sublinhado</u></p>
        <p><strong>Esse é um texto em Strong</strong></p>
        <p><mark>Esse é um texto em destaque</mark></p>
        <p>Aprenda essas <b>Informações</b> e não esqueça nunca</p>
    </body>
</html>
